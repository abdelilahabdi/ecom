services:

  mongo:
    image: mongo:7

    volumes:
      - mongo_data:/data/db

    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build: .

    ports:
      - "127.0.0.1:3001:3001"

    environment:
      PORT: "3001"

      MONGODB_URI: "mongodb://mongo:27017/ecom_br"

      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET missing in .env}"

      SEED_SELLER_EMAIL: "${SEED_SELLER_EMAIL:-seller.demo@example.com}"

      SEED_SELLER_PASSWORD: "${SEED_SELLER_PASSWORD:?SEED_SELLER_PASSWORD missing in .env}"

      SEED_CUSTOMER_PASSWORD: "${SEED_CUSTOMER_PASSWORD:?SEED_CUSTOMER_PASSWORD missing in .env}"

    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data: